name: Android build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android lint and unit tests
        run: gradle --no-daemon lintDebug testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosmos-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish direct APK download
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kosmos-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Kosmos build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
